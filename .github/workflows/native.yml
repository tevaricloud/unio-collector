name: Standalone native validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: native source (${{ matrix.platform.runner }}, ${{ matrix.platform.target }}, shard ${{ matrix.shard }})
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        platform:
          - runner: windows-2022
            target: windows-x86_64
            pytest_workers: 2
          - runner: ubuntu-22.04
            target: linux-x86_64
            pytest_workers: 2
          - runner: macos-15-intel
            target: macos-x86_64
            pytest_workers: 4
          - runner: macos-15
            target: macos-arm64
            pytest_workers: 2
    runs-on: ${{ matrix.platform.runner }}
    env:
      UNIO_NATIVE_TARGET: ${{ matrix.platform.target }}
    steps:
      - name: Reserve diagnostic upload budget
        shell: bash
        run: echo "UNIO_VALIDATION_DEADLINE_EPOCH=$(( $(date +%s) + 350 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - name: Provision reviewed Gitleaks
        shell: bash
        run: |
          python -B -m tools.collector_repository provision --root . --output "$RUNNER_TEMP/unio-ci-tools" --tools gitleaks
          echo "$RUNNER_TEMP/unio-ci-tools" >> "$GITHUB_PATH"
      - name: Install validation bootstrap dependency
        run: python -B -m tools.collector_repository bootstrap --root .
      - name: Prepare source display prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Validate native source
        timeout-minutes: 350
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python -B -m tools.collector_repository native-source --root . --source-sha "$GITHUB_SHA" --pytest-workers "${{ matrix.platform.pytest_workers }}" --test-shard "${{ matrix.shard }}" --test-shards 2 --output "$RUNNER_TEMP/Unio-source-${GITHUB_RUN_ATTEMPT}"
          else
            python -B -m tools.collector_repository native-source --root . --source-sha "$GITHUB_SHA" --pytest-workers "${{ matrix.platform.pytest_workers }}" --test-shard "${{ matrix.shard }}" --test-shards 2 --output "$RUNNER_TEMP/Unio-source-${GITHUB_RUN_ATTEMPT}"
          fi
      - name: Transfer verified source evidence
        timeout-minutes: 3
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-source-${{ matrix.platform.target }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/Unio-source-${{ github.run_attempt }}/source-evidence.json
            ${{ runner.temp }}/Unio-source-${{ github.run_attempt }}/validation-summary.json
            ${{ runner.temp }}/Unio-source-${{ github.run_attempt }}/wheel/*.whl
          retention-days: 3
          if-no-files-found: error
      - name: Retain source diagnostics
        if: ${{ always() && (failure() || cancelled()) }}
        timeout-minutes: 3
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-source-diagnostics-${{ matrix.platform.target }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/Unio-source-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/Unio-source-${{ github.run_attempt }}/*.log
          retention-days: 3
          if-no-files-found: warn
  native:
    name: native (${{ matrix.runner }}, ${{ matrix.target }})
    needs: source
    if: always()
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x86_64
            pytest_workers: 2
          - runner: ubuntu-22.04
            target: linux-x86_64
            pytest_workers: 2
          - runner: macos-15-intel
            target: macos-x86_64
            pytest_workers: 4
          - runner: macos-15
            target: macos-arm64
            pytest_workers: 2
    runs-on: ${{ matrix.runner }}
    env:
      UNIO_NATIVE_TARGET: ${{ matrix.target }}
    steps:
      - name: Require successful source validation
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
        run: test "$SOURCE_RESULT" = success
      - name: Reserve diagnostic upload budget
        shell: bash
        run: echo "UNIO_VALIDATION_DEADLINE_EPOCH=$(( $(date +%s) + 110 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - name: Provision reviewed Gitleaks
        shell: bash
        run: |
          python -B -m tools.collector_repository provision --root . --output "$RUNNER_TEMP/unio-ci-tools" --tools gitleaks
          echo "$RUNNER_TEMP/unio-ci-tools" >> "$GITHUB_PATH"
      - name: Install validation bootstrap dependency
        run: python -B -m tools.collector_repository bootstrap --root .
      - name: Download exact source evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-source-${{ matrix.target }}-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Unio-source-transfer
      - name: Prepare Windows packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Prepare Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb dpkg-dev clamav binutils
          CLAMAV_ROOT="/tmp/unio-collector-clamav-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CLAMAV_DATABASE="$CLAMAV_ROOT/database"
          sudo install -d -o clamav -g clamav -m 0755 "$CLAMAV_ROOT" "$CLAMAV_DATABASE"
          sudo -u clamav freshclam --datadir="$CLAMAV_DATABASE" --log="$CLAMAV_ROOT/freshclam.log"
          echo "UNIO_COLLECTOR_CLAMAV_DATABASE=$CLAMAV_DATABASE" >> "$GITHUB_ENV"
      - name: Prepare macOS malware scanner
        if: runner.os == 'macOS'
        run: |
          brew install clamav
          mkdir -p "$RUNNER_TEMP/unio-collector-clamav"
          printf 'DatabaseDirectory %s\nDatabaseMirror database.clamav.net\n' "$RUNNER_TEMP/unio-collector-clamav" > "$RUNNER_TEMP/unio-collector-freshclam.conf"
          freshclam --config-file="$RUNNER_TEMP/unio-collector-freshclam.conf"
          echo "UNIO_COLLECTOR_CLAMAV_DATABASE=$RUNNER_TEMP/unio-collector-clamav" >> "$GITHUB_ENV"
      - name: Validate native collector
        timeout-minutes: 105
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python -B -m tools.collector_repository native --root . --source-sha "$GITHUB_SHA" --source-evidence "$RUNNER_TEMP/Unio-source-transfer" --test-shards 2 --pytest-workers "${{ matrix.pytest_workers }}" --output "$RUNNER_TEMP/unio-collector-native-${GITHUB_RUN_ATTEMPT}"
          else
            python -B -m tools.collector_repository native --root . --source-sha "$GITHUB_SHA" --source-evidence "$RUNNER_TEMP/Unio-source-transfer" --test-shards 2 --pytest-workers "${{ matrix.pytest_workers }}" --output "$RUNNER_TEMP/unio-collector-native-${GITHUB_RUN_ATTEMPT}"
          fi
      - name: Retain compact validation evidence
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-evidence-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/validation-summary.json
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/process-progress.json
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/source-evidence.json
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/installed-wheel-summary.json
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/native/*summary.json
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/native/*manifest.json
          retention-days: 3
          if-no-files-found: warn
      - name: Retain native failure diagnostics
        timeout-minutes: 3
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-validation-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/process-progress.json
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/validation-summary.json
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/native-build.log
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/native-installer.log
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/native-malware.log
          retention-days: 3
          if-no-files-found: warn
      - name: Retain unsigned artifacts on explicit dispatch
        timeout-minutes: 5
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-artifacts-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/native/*.zip
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/native/*.msi
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/native/*.deb
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/native/*.pkg
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/native/*.json
            ${{ runner.temp }}/unio-collector-native-${{ github.run_attempt }}/native/*.txt
          retention-days: 7
          if-no-files-found: error
