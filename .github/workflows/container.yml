name: Standalone collector container build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build reviewed standalone source without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          docker buildx build . --file Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg "COLLECTOR_VERSION=$version" \
            --build-arg "PUBLIC_SOURCE_SHA=$GITHUB_SHA" \
            --build-arg "PUBLIC_SOURCE_TAG=source-validation" \
            --sbom=true --provenance=mode=min \
            --output "type=oci,dest=$RUNNER_TEMP/collector-candidate.tar"
          tar -tf "$RUNNER_TEMP/collector-candidate.tar" | grep -Fxq index.json
